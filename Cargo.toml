[package]
name = "cat-catch-assistant"
version = "1.1.0"
edition = "2021"
# 包名保持 ASCII，产物名通过 [[bin]] 指定为中文。
autobins = false

[[bin]]
name = "M3U8下载器"
path = "src/main.rs"

# 构建期嵌入 Windows 资源（exe 图标）。
[build-dependencies]
embed-resource = "3"

[dependencies]
aes = "0.8"
arboard = { version = "3.6", default-features = false }
cbc = { version = "0.1", features = ["alloc"] }
chrono = "0.4"
dirs = "5"
eframe = "0.29.1"
encoding_rs = "0.8"
flate2 = "1"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["ico"] }
reqwest = { version = "0.12", default-features = false, features = ["charset", "gzip", "json", "rustls-tls", "socks", "stream"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# 按实际使用精简，不启用 full：生产代码用到 rt-multi-thread / sync / fs / io-util /
# time / process（ffmpeg），net 只被 e2e 测试的本地服务器用到，一并声明避免拆 dev-dependencies。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "fs", "io-util", "time", "process"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
tray-icon = "0.24"
url = "2"
