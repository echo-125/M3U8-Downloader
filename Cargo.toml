[package]
name = "cat-catch-assistant"
version = "0.1.0"
edition = "2021"

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
chrono = "0.4"
dirs = "5"
eframe = "0.29.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["charset", "gzip", "json", "rustls-tls", "socks"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
tray-icon = "0.24"
url = "2"
